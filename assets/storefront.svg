<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">واجهة مؤسسة وليد سعود الثبيتي للتجارة للسباكة والكهرباء</title>
  <desc id="desc">رسم تعريفي لواجهة متجر مستلزمات سباكة وكهرباء في حي الملقا بالرياض.</desc>
  <defs>
