      <stop offset="0" stop-color="#f5efe4"/>
      <stop offset="1" stop-color="#e4d7c7"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#051326"/>
      <stop offset="0.55" stop-color="#091b35"/>
      <stop offset="1" stop-color="#0e2a49"/>
    </linearGradient>
    <linearGradient id="shop" x1="0" y1="0" x2="0" y2="1">
